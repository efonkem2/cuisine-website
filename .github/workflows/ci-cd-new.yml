name: 🚀 NoelaCuisine Infrastructure & CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  IMAGE_NAME: noelacuisine
  AWS_REGION: us-east-1

jobs:
  # ====================================================================================
  # INFRASTRUCTURE PROVISIONINGS
  # ====================================================================================
  provision-infrastructure:
    name:  Provision Infrastructure & Self-Hosted Runner
    runs-on: ubuntu-latest
    
    outputs:
      github-runner-ip: ${{ steps.terraform-outputs.outputs.github-runner-ip }}
      nexus-url: ${{ steps.terraform-outputs.outputs.nexus-url }}
      nexus-registry: ${{ steps.terraform-outputs.outputs.nexus-registry }}
      sonar-url: ${{ steps.terraform-outputs.outputs.sonar-url }}
      grafana-url: ${{ steps.terraform-outputs.outputs.grafana-url }}
    
    defaults:
      run:
        working-directory: ./terraform
        
    steps:
    - name:  Checkout code
      uses: actions/checkout@v4

    - name:  Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0
        terraform_wrapper: false

    - name: 🔧 Terraform Init
      run: terraform init

    - name: Terraform Validate
      run: terraform validate

    - name:   Select/Create Workspace
      env:
        TF_WORKSPACE: ${{ github.event.inputs.deploy_environment || (github.ref_name == 'main' && 'production' || 'staging') }}
      run: |
        terraform workspace select $TF_WORKSPACE || terraform workspace new $TF_WORKSPACE

    - name: 📊 Terraform Plan
      env:
        TF_VAR_environment: ${{ github.event.inputs.deploy_environment || (github.ref_name == 'main' && 'production' || 'staging') }}
        TF_VAR_public_key: ${{ secrets.TF_VAR_PUBLIC_KEY }}
        TF_VAR_github_token: ${{ secrets.TF_VAR_GITHUB_TOKEN }}
        TF_VAR_github_repo: ${{ github.repository }}
      run: terraform plan

    - name: 🚀 Terraform Apply
      if: github.event_name != 'pull_request'
      env:
        TF_VAR_environment: ${{ github.event.inputs.deploy_environment || (github.ref_name == 'main' && 'production' || 'staging') }}
        TF_VAR_public_key: ${{ secrets.TF_VAR_PUBLIC_KEY }}
        TF_VAR_github_token: ${{ secrets.TF_VAR_GITHUB_TOKEN }}
        TF_VAR_github_repo: ${{ github.repository }}
      run: terraform apply -auto-approve

    - name: 📊 Get Infrastructure Outputs
      id: terraform-outputs
      if: github.event_name != 'pull_request'
      run: |
        echo "github-runner-ip=$(terraform output -raw github_runner_public_ip)" >> $GITHUB_OUTPUT
        echo "nexus-url=$(terraform output -raw nexus_url)" >> $GITHUB_OUTPUT
        echo "nexus-registry=$(terraform output -raw github_runner_public_ip):8081/repository/docker-hosted/" >> $GITHUB_OUTPUT
        echo "sonar-url=$(terraform output -raw sonarqube_url)" >> $GITHUB_OUTPUT
        echo "grafana-url=$(terraform output -raw grafana_url)" >> $GITHUB_OUTPUT

    - name: ⏳ Wait for Self-Hosted Runner Registration
      if: github.event_name != 'pull_request'
      run: |
        echo "🔄 Waiting for GitHub self-hosted runner to register..."
        echo "Runner IP: ${{ steps.terraform-outputs.outputs.github-runner-ip }}"
        
        # Wait up to 10 minutes for runner to register
        timeout=600
        interval=30
        elapsed=0
        
        while [ $elapsed -lt $timeout ]; do
          if curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
             "https://api.github.com/repos/${{ github.repository }}/actions/runners" | \
             jq -e '.runners[] | select(.status == "online" and (.labels[] | select(.name == "self-hosted")))' > /dev/null; then
            echo "✅ Self-hosted runner is online and ready!"
            break
          fi
          
          echo "⏳ Waiting for runner... (${elapsed}s elapsed)"
          sleep $interval
          elapsed=$((elapsed + interval))
        done
        
        if [ $elapsed -ge $timeout ]; then
          echo "⚠️ Timeout waiting for runner, but continuing..."
        fi

  # ====================================================================================
  # SOURCE CODE SCANNING
  # ====================================================================================
  scan-source-code:
    name: 🔍 Scan Source Code
    runs-on: [self-hosted, linux]
    needs: provision-infrastructure
    if: github.event_name != 'pull_request' || success()
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔍 Scan src directory structure
      run: |
        echo "📁 Analyzing source directory structure..."
        echo "==========================================="
        find src/ -type f -name "*.html" -o -name "*.css" -o -name "*.js" | head -20
        
        echo ""
        echo "📊 File count by type:"
        echo "HTML files: $(find src/ -name "*.html" | wc -l)"
        echo "CSS files:  $(find src/ -name "*.css" | wc -l)"
        echo "JS files:   $(find src/ -name "*.js" | wc -l)"
        
        echo ""
        echo "📏 Total source size:"
        du -sh src/

    - name: 🔒 Security scan of src directory
      run: |
        echo "🔍 Running security scans on src directory..."
        
        # Install trivy if not present
        if ! command -v trivy &> /dev/null; then
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        fi
        
        # Scan source directory
        trivy fs --format table src/
        trivy fs --format sarif --output src-trivy-results.sarif src/

    - name: 🌐 Web security analysis
      run: |
        echo "🌐 Analyzing web security in src directory..."
        
        # Check for potential XSS vulnerabilities
        echo "🔍 Checking for potential XSS vulnerabilities..."
        find src/ -name "*.html" -exec grep -Hn "innerHTML\|outerHTML\|document.write\|eval(" {} \; || echo "✅ No obvious XSS patterns found"
        
        # Check for insecure external resources
        echo ""
        echo "🔍 Checking for insecure external resources..."
        find src/ -name "*.html" -exec grep -Hn "http://" {} \; || echo "✅ No insecure HTTP links found"
        
        # Check for missing security attributes
        echo ""
        echo "🔍 Checking external links for security attributes..."
        find src/ -name "*.html" -exec grep -Hn 'target="_blank"' {} \; | \
        while read line; do
          if echo "$line" | grep -q 'rel="noopener'; then
            echo "✅ $line (has security attributes)"
          else
            echo "⚠️ $line (missing rel='noopener noreferrer')"
          fi
        done

    - name: 🎨 Code quality analysis
      run: |
        echo "🎨 Running code quality checks on src directory..."
        
        # Create minimal package.json if needed
        if [ ! -f package.json ]; then
          cat > package.json << 'EOF'
        {
          "name": "noelacuisine",
          "version": "1.0.0",
          "devDependencies": {
            "htmlhint": "^1.1.4",
            "stylelint": "^15.0.0",
            "eslint": "^8.0.0"
          }
        }
        EOF
          npm install --silent
        fi
        
        # HTML validation
        echo "📝 Validating HTML files..."
        npx htmlhint src/*.html || echo "HTML validation completed with warnings"
        
        # CSS validation
        echo ""
        echo "🎨 Validating CSS files..."
        npx stylelint "src/*.css" --config-basedir . || echo "CSS validation completed with warnings"
        
        # JS validation
        echo ""
        echo "🔧 Validating JavaScript files..."
        npx eslint src/*.js --env browser || echo "JS validation completed with warnings"

    - name: 📊 SonarQube Analysis
      env:
        SONAR_HOST_URL: ${{ needs.provision-infrastructure.outputs.sonar-url }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        echo "📊 Running SonarQube analysis on src directory..."
        
        # Wait for SonarQube to be ready
        echo "🔄 Waiting for SonarQube server to be ready..."
        timeout=300
        while [ $timeout -gt 0 ]; do
          if curl -s "${SONAR_HOST_URL}/api/system/status" | grep -q '"status":"UP"'; then
            echo "✅ SonarQube is ready!"
            break
          fi
          echo "⏳ SonarQube not ready yet, waiting... (${timeout}s remaining)"
          sleep 10
          timeout=$((timeout - 10))
        done
        
        # Create sonar-project.properties for src analysis
        cat > sonar-project.properties << EOF
        sonar.projectKey=noelacuisine
        sonar.projectName=NoelaCuisine
        sonar.projectVersion=1.0
        sonar.sources=src/
        sonar.sourceEncoding=UTF-8
        sonar.exclusions=**/*.min.js,**/node_modules/**
        EOF
        
        # Run SonarQube scanner
        /opt/sonar-scanner/bin/sonar-scanner \
          -Dsonar.projectKey=noelacuisine \
          -Dsonar.sources=src/ \
          -Dsonar.host.url=${SONAR_HOST_URL} \
          -Dsonar.login=${SONAR_TOKEN} || echo "SonarQube scan completed with issues"

    - name: 📤 Upload scan results
      uses: actions/upload-artifact@v4
      with:
        name: source-scan-results
        path: |
          src-trivy-results.sarif
          sonar-project.properties

  # ====================================================================================
  # CONTAINER BUILD & SCAN
  # ====================================================================================
  build-container:
    name: 🐳 Build Container from Source
    runs-on: [self-hosted, linux]
    needs: [provision-infrastructure, scan-source-code]
    if: github.event_name != 'pull_request' || success()
    
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
      
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔍 Pre-build source verification
      run: |
        echo "🔍 Verifying source files before container build..."
        echo "================================================="
        
        echo "📁 Source directory contents:"
        ls -la src/
        
        echo ""
        echo "📏 Source file sizes:"
        du -h src/*
        
        echo ""
        echo "📋 Dockerfile context verification:"
        if [ -f Dockerfile ]; then
          echo "✅ Dockerfile found"
          echo "📝 Dockerfile content preview:"
          head -10 Dockerfile
        else
          echo "❌ Dockerfile not found!"
          exit 1
        fi

    - name: 🏗️ Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🏷️ Extract container metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ needs.provision-infrastructure.outputs.nexus-registry }}${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: 🔐 Log in to Nexus Docker Registry
      if: github.event_name != 'pull_request'
      run: |
        echo "🔐 Logging in to Nexus Docker Registry..."
        
        # Wait for Nexus to be ready
        NEXUS_URL="${{ needs.provision-infrastructure.outputs.nexus-url }}"
        echo "🔄 Waiting for Nexus to be ready at $NEXUS_URL..."
        timeout=300
        while [ $timeout -gt 0 ]; do
          if curl -s -o /dev/null -w "%{http_code}" "$NEXUS_URL" | grep -q "200\|302"; then
            echo "✅ Nexus is ready!"
            break
          fi
          echo "⏳ Nexus not ready yet, waiting... (${timeout}s remaining)"
          sleep 10
          timeout=$((timeout - 10))
        done
        
        # Extract registry URL without protocol
        NEXUS_REGISTRY=$(echo "${{ needs.provision-infrastructure.outputs.nexus-registry }}" | sed 's|/$||')
        
        echo "🔑 Logging into Nexus registry: $NEXUS_REGISTRY"
        echo "${{ secrets.NEXUS_PASSWORD }}" | docker login $NEXUS_REGISTRY -u "${{ secrets.NEXUS_USERNAME }}" --password-stdin

    - name: 🔨 Build container from source
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: 🔒 Container security scan
      run: |
        echo "🔒 Running security scan on built container..."
        
        # Install trivy if not present
        if ! command -v trivy &> /dev/null; then
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        fi
        
        # Get the first tag for scanning
        IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
        echo "🔍 Scanning image: $IMAGE_TAG"
        
        trivy image --format table $IMAGE_TAG
        trivy image --format sarif --output container-trivy-results.sarif $IMAGE_TAG

    - name: 🔍 Container analysis
      run: |
        echo "🔍 Analyzing built container..."
        echo "================================"
        
        # Show built images
        docker images | grep noelacuisine
        
        # Get image details
        IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
        echo ""
        echo "📊 Container details for: $IMAGE_TAG"
        echo "Registry: ${{ needs.provision-infrastructure.outputs.nexus-registry }}"
        echo "Size: $(docker images $IMAGE_TAG --format 'table {{.Size}}' | tail -1)"
        echo "Created: $(docker images $IMAGE_TAG --format 'table {{.CreatedAt}}' | tail -1)"
        
        echo ""
        echo "📋 Container layers:"
        docker history $IMAGE_TAG --no-trunc
        
        echo ""
        echo "🔍 Container file system (src directory):"
        docker run --rm $IMAGE_TAG ls -la /usr/share/nginx/html/ || echo "Could not inspect container filesystem"

    - name: 📤 Upload container scan results
      uses: actions/upload-artifact@v4
      with:
        name: container-scan-results
        path: container-trivy-results.sarif

  # ====================================================================================
  # DEPLOYMENT
  # ====================================================================================
  deploy-application:
    name: 🚀 Deploy Application
    runs-on: [self-hosted, linux]
    needs: [provision-infrastructure, build-container]
    if: github.event_name != 'pull_request' && success()
    environment: ${{ github.event.inputs.deploy_environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    
    steps:
    - name: 🚀 Deploy NoelaCuisine Container
      run: |
        echo "🚀 Deploying NoelaCuisine application..."
        echo "========================================"
        
        IMAGE_TAG="${{ needs.build-container.outputs.image-tag }}"
        echo "🐳 Deploying image from Nexus: $IMAGE_TAG"
        echo "📍 Registry: ${{ needs.provision-infrastructure.outputs.nexus-registry }}"
        
        # Log in to Nexus for pulling
        NEXUS_REGISTRY=$(echo "${{ needs.provision-infrastructure.outputs.nexus-registry }}" | sed 's|/$||')
        echo "${{ secrets.NEXUS_PASSWORD }}" | docker login $NEXUS_REGISTRY -u "${{ secrets.NEXUS_USERNAME }}" --password-stdin
        
        # Stop existing container if running
        docker stop noelacuisine-app || true
        docker rm noelacuisine-app || true
        
        # Pull and run new container from Nexus
        docker pull $(echo "$IMAGE_TAG" | head -n 1)
        docker run -d \
          --name noelacuisine-app \
          --restart unless-stopped \
          -p 8080:80 \
          $(echo "$IMAGE_TAG" | head -n 1)
        
        echo "✅ Container deployed successfully from Nexus registry!"
        echo "🌐 Application available at: http://$(curl -s ifconfig.me):8080"

    - name: 🏥 Health check
      run: |
        echo "🏥 Running application health checks..."
        
        # Wait for application to be ready
        sleep 30
        
        # Check if container is running
        if docker ps | grep -q noelacuisine-app; then
          echo "✅ Container is running"
        else
          echo "❌ Container is not running"
          docker logs noelacuisine-app
          exit 1
        fi
        
        # Check HTTP response
        if curl -f -s http://localhost:8080 > /dev/null; then
          echo "✅ Application responding on port 8080"
        else
          echo "❌ Application not responding"
          exit 1
        fi

    - name: 📝 Deployment Summary
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: ${{ github.event.inputs.deploy_environment || (github.ref_name == 'main' && 'production' || 'staging') }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: ${{ needs.build-container.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Runner IP**: ${{ needs.provision-infrastructure.outputs.github-runner-ip }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Service URLs:" >> $GITHUB_STEP_SUMMARY
        echo "- **Application**: http://${{ needs.provision-infrastructure.outputs.github-runner-ip }}:8080" >> $GITHUB_STEP_SUMMARY
        echo "- **Nexus Repository**: ${{ needs.provision-infrastructure.outputs.nexus-url }}" >> $GITHUB_STEP_SUMMARY
        echo "- **SonarQube**: ${{ needs.provision-infrastructure.outputs.sonar-url }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Grafana Monitoring**: ${{ needs.provision-infrastructure.outputs.grafana-url }}" >> $GITHUB_STEP_SUMMARY