# SonarQube Project Configuration
sonar.projectKey=noelacuisine
sonar.projectName=NoelaCuisine
sonar.projectVersion=1.0

# Source Configuration
sonar.sources=src/
sonar.sourceEncoding=UTF-8

# Language Configuration
sonar.javascript.file.suffixes=.js,.jsx
sonar.css.file.suffixes=.css,.scss,.sass
sonar.html.file.suffixes=.html,.htm

# Exclusions
sonar.exclusions=**/*.min.js,**/node_modules/**,**/vendor/**,**/*.map

# Coverage (if you add testing later)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality Gate
sonar.qualitygate.wait=true

# Web-specific settings
sonar.web.fileExtensions=.html,.htm,.jsp,.xhtml